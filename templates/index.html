<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>همیار کد رشید</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/lib/prism-tomorrow.min.css">
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
</head>
<body>
  <div class="form-container">
    <h1>همیار کد رشید</h1>
    <p class="subtitle">تحلیل، پیشنهاد، و اعمال تغییرات کد با جریان امن‌تر و دقیق‌تر</p>
    <p class="privacy-banner" role="note">محتوای پروژه انتخاب‌شده برای پردازش به سرویس Metis ارسال می‌شود.</p>
    <div class="utility-bar">
      <button type="button" id="choosePathBtn" class="ghost-btn">انتخاب مسیر پروژه</button>
      <button type="button" id="refreshPathBtn" class="ghost-btn">به‌روزرسانی مسیر</button>
      <button type="button" id="clearOutputBtn" class="ghost-btn">پاکسازی خروجی</button>
    </div>
    <form id="dataForm">
      <label for="textInput">چه کمکی از دستم بر میاد:</label>
      <textarea id="textInput" rows="5" placeholder="متن درخواستی خود را اینجا بنویسید... (Ctrl+Enter برای ارسال سریع)"></textarea>
      <div class="actions">
        <button id="submitBtn" type="submit">ارسال</button>
        <button type="button" id="applyChangesBtn" disabled>اعمال تغییرات</button>
      </div>
    </form>
    <!-- نمایش مسیر انتخاب شده -->
    <div id="selectedPathDisplay" class="path-display" title="مسیر فعال پروژه"></div>
    <div id="statusBar" class="status-bar" aria-live="polite">آماده</div>
    <div id="output"></div>
  </div>



   <!-- اضافه کردن کتابخانه‌های Markdown و Syntax Highlighting -->
  <script src="/static/lib/marked.min.js"></script>
  <script src="/static/lib/prism-autoloader.min.js"></script>
  <script src="/static/lib/prism-core.min.js"></script>


  <script src="/static/script.js"></script>



</body>
</html>
