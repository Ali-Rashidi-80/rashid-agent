[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rashid-agent"
version = "0.1.0"
description = "Rashid Agent — local coding agent + multi-tenant knowledge platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.2.0",
    "alembic>=1.14.0",
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    "arq>=0.26.0",
    "pyyaml>=6.0.0",
    "python-multipart>=0.0.9",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "cryptography>=43.0.0",
    "Pillow>=10.0.0",
    "rapidocr-onnxruntime>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "httpx>=0.28.0",
    "black==26.5.1",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.11.0",
    "types-PyYAML>=6.0.0",
]

[tool.setuptools.package-data]
"app" = ["prompts/**/*", "py.typed"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*", "worker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Import sorting is owned by isort (profile=black); ruff handles style/bugs only.
select = ["E", "F", "UP"]
ignore = ["E501"]

# Formatter: black is canonical. Ruff is used for lint only (not format) to avoid drift.
[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = """
/(
  alembic/versions
)/
"""

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["app", "worker", "tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
packages = ["app", "worker"]
mypy_path = "backend"
explicit_package_bases = true
