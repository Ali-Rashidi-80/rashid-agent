# Shared PyPI config for Docker builds (Iran / Chabokan)
# Docs: https://docs.chabokan.net/simple-hosting/python/more/
[global]
index-url = https://mirror2.chabokan.net/pypi/simple/
trusted-host = mirror2.chabokan.net pypi.org files.pythonhosted.org
timeout = 120
retries = 5
prefer-binary = true
disable-pip-version-check = true
